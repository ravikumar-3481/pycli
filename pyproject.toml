[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpyps"
version = "1.1.3"
description = "Scaffold production-ready AI/ML, RAG, Backend, and Data Science project structures with one command."
readme = "README.md"
authors = [
    { name = "Ravi Vishwakarma" },
    { email = "devloper.ravi.07@gmail.com" }
]
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "cli",
    "scaffolding",
    "ai",
    "ml",
    "rag",
    "backend",
    "data-science",
    "project-generator",
    "mkproject"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
mkproject = "cpyps.cli:main"
cpyps = "cpyps.cli:main"

[project.urls]
Homepage = "https://github.com/ravikumar-3481/pycli"
Repository = "https://github.com/ravikumar-3481/pycli.git"
Issues = "https://github.com/ravikumar-3481/pycli/issues"
Documentation = "https://github.com/ravikumar-3481/pycli#readme"

[tool.setuptools]
packages = ["cpyps", "cpyps.templates"]